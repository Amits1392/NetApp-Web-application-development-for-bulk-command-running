<html>
<head>
<title>Manage Users</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:500px;
    padding:40px;
    border-radius:20px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:30px;
}

select{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-bottom:20px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:red;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:darkred;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    background:#2563eb;
    color:white;
    padding:12px;
    text-decoration:none;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Manage Users</h2>

<form method="post">

<select name="username" required>

<option value="">
Select User to Delete
</option>

{% for user in users %}
<option value="{{user[0]}}">
{{user[0]}}
</option>
{% endfor %}

</select>

<button type="submit">
Delete Selected User
</button>

</form>

<a href="/dashboard" class="back-btn">
Back to Dashboard
</a>

</div>

</body>
</html>
