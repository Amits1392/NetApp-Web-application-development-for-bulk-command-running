<html>
<head>
<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#2563eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:40px;
width:600px;
border-radius:20px;
text-align:center;
box-shadow:0px 10px 30px rgba(0,0,0,0.3);
}

.btn{
padding:12px 25px;
text-decoration:none;
color:white;
border-radius:10px;
margin:10px;
display:inline-block;
}

.yes-btn{
background:green;
}

.no-btn{
background:red;
}
</style>
</head>

<body>

<div class="box">

<h2 style="color:{{color}}">
{{message}}
</h2>

{% if show_options %}

<h3>Do you want to run another command?</h3>

<a href="/dashboard" class="btn yes-btn">
Yes
</a>

<a href="/logout" class="btn no-btn">
No (Logout)
</a>

{% else %}

<a href="/dashboard" class="btn yes-btn">
Back
</a>

{% endif %}

</div>

</body>
</html>
