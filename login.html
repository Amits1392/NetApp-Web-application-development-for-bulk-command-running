<html>
<head>
<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:40px;
width:420px;
border-radius:20px;
box-shadow:0px 10px 30px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#1e3a8a;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
}

.error{
color:red;
text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

<h1>NetApp Automation Portal</h1>

{% if error %}
<p class="error">{{error}}</p>
{% endif %}

<form action="/validate_login" method="post">

<input type="text" name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
